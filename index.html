<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSummary - YouTube Video Summarizer</title>
  <style>
    /* Basic reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #f4f4f9; color: #333; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a73e8;
      color: white;
      padding: 1rem 2rem;
    }
    header .logo { font-size: 1.5rem; font-weight: bold; }
    header .nav input {
      padding: 0.5rem; width: 300px; border-radius: 4px; border: none; margin-right: 0.5rem;
    }
    header .nav button {
      padding: 0.5rem 1rem; background-color: #ffca28; border: none; border-radius: 4px;
      cursor: pointer; font-weight: bold;
    }
    header .nav button:hover { background-color: #ffc107; }

    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .video-preview {
      background-color: white; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;
      display: none;
    }
    .summary-section {
      background-color: white; padding: 1rem; border-radius: 8px;
    }
    .summary-section textarea {
      width: 100%; height: 200px; padding: 1rem; border-radius: 4px; border: 1px solid #ccc;
      resize: none; margin-bottom: 1rem;
    }
    .summary-section .buttons { display: flex; gap: 1rem; }
    .summary-section button {
      padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer;
      background-color: #1a73e8; color: white; font-weight: bold;
    }
    .summary-section button:hover { background-color: #1669c1; }

    footer { text-align: center; margin: 2rem 0; color: #555; }
  </style>
</head>
<body>
  <header>
    <div class="logo">VidSummary</div>
    <div class="nav">
      <input type="text" id="youtube-url" placeholder="Paste YouTube video link here...">
      <button id="summarize-btn">Summarize</button>
    </div>
  </header>

  <main>
    <section class="video-preview" id="video-preview"></section>

    <section class="summary-section" id="summary-section">
      <h2>Summary</h2>
      <textarea id="summary-text" readonly placeholder="Your video summary will appear here..."></textarea>
      <div class="buttons">
        <button id="copy-btn">Copy</button>
        <button id="download-btn">Download</button>
      </div>
    </section>
  </main>

  <footer>&copy; 2026 VidSummary. All rights reserved.</footer>

  <script>
  const summarizeBtn = document.getElementById("summarize-btn");
const youtubeUrlInput = document.getElementById("youtube-url");
const videoPreview = document.getElementById("video-preview");
const summaryText = document.getElementById("summary-text");
const copyBtn = document.getElementById("copy-btn");
const downloadBtn = document.getElementById("download-btn");

// 🔴 IMPORTANT: Use webhook-test for testing, then switch to webhook for production
const WEBHOOK_URL = "https://sundar02.app.n8n.cloud/webhook-test/youtube-summary"; // Change to /webhook/ when workflow is activated

summarizeBtn.addEventListener("click", async () => {
  const url = youtubeUrlInput.value.trim();
  
  // Validate input
  if (!url) {
    alert("Please enter a YouTube video URL!");
    return;
  }

  // Validate it's a YouTube URL
  if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
    alert("Please enter a valid YouTube URL!");
    return;
  }

  // Show video preview
  videoPreview.style.display = "block";
  videoPreview.innerHTML = `
    <p><strong>Video URL:</strong> 
    <a href="${url}" target="_blank">${url}</a></p>
  `;

  // Show loading state
  summaryText.value = "⏳ Generating summary... This may take 30-60 seconds.";
  summarizeBtn.disabled = true;
  summarizeBtn.textContent = "Processing...";

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        youtubeUrl: url  // Sending as youtubeUrl (matches n8n code node)
      })
    });

    // Check if request was successful
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`Server error: ${response.status} - ${errorText}`);
    }

    const data = await response.json();
    console.log('Response from n8n:', data); // For debugging
    
    // Display the summary (handles multiple possible response formats)
    if (data.summary) {
      summaryText.value = data.summary;
    } else if (data.formatted_summary) {
      summaryText.value = data.formatted_summary;
    } else if (data.message) {
      summaryText.value = data.message;
    } else {
      summaryText.value = JSON.stringify(data, null, 2); // Show full response if structure is different
    }
    
  } catch (error) {
    console.error('Error details:', error);
    summaryText.value = `❌ Error generating summary:\n\n${error.message}\n\nPlease check:\n1. Is your n8n workflow activated?\n2. Is the webhook URL correct?\n3. Check browser console (F12) for details`;
  } finally {
    // Re-enable button
    summarizeBtn.disabled = false;
    summarizeBtn.textContent = "Summarize";
  }
});

// Copy summary to clipboard
copyBtn.addEventListener("click", () => {
  if (!summaryText.value || summaryText.value.includes("⏳") || summaryText.value.includes("❌")) {
    alert("Please generate a summary first!");
    return;
  }
  
  summaryText.select();
  document.execCommand("copy");
  
  // Visual feedback
  const originalText = copyBtn.textContent;
  copyBtn.textContent = "✅ Copied!";
  setTimeout(() => {
    copyBtn.textContent = originalText;
  }, 2000);
});

// Download summary as text file
downloadBtn.addEventListener("click", () => {
  if (!summaryText.value || summaryText.value.includes("⏳") || summaryText.value.includes("❌")) {
    alert("Please generate a summary first!");
    return;
  }
  
  const blob = new Blob([summaryText.value], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  
  // Generate filename with timestamp
  const timestamp = new Date().toISOString().slice(0, 10);
  link.download = `youtube-summary-${timestamp}.txt`;
  
  link.click();
  
  // Cleanup
  URL.revokeObjectURL(link.href);
});
</script>
</body>
</html>
